
name: Build HTML to iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create iOS project
        run: |
          mkdir ios-project
          cd ios-project
          cordova create app com.example.myapp MyApp
          cd app
          cordova platform add ios

      - name: Copy HTML files
        run: |
          cp index.html ios-project/app/www/index.html
          cp style.css ios-project/app/www/style.css
          cp script.js ios-project/app/www/script.js

      - name: Build iOS
        run: |
          cd ios-project/app
          cordova build ios --device

      - name: Create IPA
        run: |
          cd ios-project/app
          mkdir -p Payload
          cp -R platforms/ios/build/device/*.app Payload/
          zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-IPA
          path: ios-project/app/MyApp.ipa

